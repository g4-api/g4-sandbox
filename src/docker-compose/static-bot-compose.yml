version: "3.8"

configs:
  nginx_conf:
    file: ./static-bot-nginx.conf    # <-- must point to a real file

services:
  proxy:
    image: nginx:stable
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    ports:
      - "54252:80"
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0    # unlimited retries

  bot:
    image: g4-static-bot:latest
    volumes:
      - C:/g4-bots-volume:/bots
    environment:
      BOT_NAME:                 "g4-static-bot"
      CALLBACK_INGRESS:         "http://host.docker.internal:54252"
      DRIVER_BINARIES:          "http://host.docker.internal:4444/wd/hub"
      HUB_URI:                  "http://host.docker.internal:9944"
      STATIC_BOT_INTERVAL_TIME: "5"
      TOKEN: "${G4_LICENSE_TOKEN}"
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 5s
    networks:
      - backend

networks:
  backend:
    driver: overlay
