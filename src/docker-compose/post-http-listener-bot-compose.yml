version: "3.8"

configs:
  nginx_conf:
    file: ./post-http-listener-bot-nginx.conf    # <-- must point to a real file

services:
  proxy:
    image: nginx:stable
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    ports:
      - "54256:80"
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 0    # unlimited retries

  bot:
    image: g4-http-post-listener-bot:latest
    volumes:
      - C:/g4-bots-volume:/bots
    environment:
      BOT_NAME:            "g4-http-listener-bot"
      CALLBACK_INGRESS:    "http://host.docker.internal:54256"
      DRIVER_BINARIES:     "http://host.docker.internal:4444/wd/hub"
      ENTRY_POINT_INGRESS: "http://host.docker.internal:54256"
      HUB_URI:             "http://host.docker.internal:9944"
      TOKEN: "${G4_LICENSE_TOKEN}"
    expose:
      - "9213"
      - "9123"
    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 5s
    networks:
      - backend

networks:
  backend:
    driver: overlay
